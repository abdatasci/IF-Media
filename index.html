function Tag({ children, color = C.amber }) {
  return (
    <span style={{
      background: color + "20", border: `1px solid ${color}50`,
      color, fontSize: 10, padding: "2px 8px", borderRadius: 20,
      letterSpacing: 1, fontWeight: 700, textTransform: "uppercase",
      whiteSpace: "nowrap", display: "inline-block",
    }}>{children}</span>
  );
}

function NavBtn({ label, active, onClick }) {
  return (
    <button onClick={onClick} style={{
      background: "none", border: "none",
      borderBottom: `2px solid ${active ? C.amber : "transparent"}`,
      color: active ? C.white : C.muted, padding: "14px 18px",
      cursor: "pointer", fontSize: 12, fontWeight: active ? 700 : 400,
      letterSpacing: 1, textTransform: "uppercase", transition: "all 0.15s",
    }}>{label}</button>
  );
}

function Poster() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#040608");
    bg.addColorStop(0.5, "#0D1117");
    bg.addColorStop(1, "#080A0F");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 6000; i++) {
      const x = Math.random() * W, y = Math.random() * H;
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.06})`;
      ctx.fillRect(x, y, 1, 1);
    }
    const glow = ctx.createRadialGradient(W/2, H*0.42, 0, W/2, H*0.42, W*0.55);
    glow.addColorStop(0, "rgba(212,148,10,0.18)");
    glow.addColorStop(0.4, "rgba(212,148,10,0.06)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    for (let r = 60; r < W * 0.7; r += 55) {
      ctx.beginPath();
      ctx.arc(W/2, H*0.42, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(212,148,10,${Math.max(0, 0.12 - r/4000)})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
    [0.05, 0.92].forEach(yPct => {
      const y = H * yPct;
      ctx.fillStyle = "rgba(212,148,10,0.08)";
      ctx.fillRect(0, y, W, H * 0.045);
      for (let x = 20; x < W - 20; x += 48) {
        ctx.fillStyle = "rgba(212,148,10,0.15)";
        ctx.fillRect(x, y + 5, 32, H * 0.032);
      }
    });
    const ex = W/2, ey = H*0.40, ew = W*0.32, eh = W*0.09;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(ex - ew, ey);
    ctx.bezierCurveTo(ex - ew/2, ey - eh*2, ex + ew/2, ey - eh*2, ex + ew, ey);
    ctx.bezierCurveTo(ex + ew/2, ey + eh*2, ex - ew/2, ey + eh*2, ex - ew, ey);
    ctx.strokeStyle = "rgba(212,148,10,0.55)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ex, ey, ew * 0.22, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(212,148,10,0.7)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ex, ey, ew * 0.09, 0, Math.PI * 2);
    const pupilG = ctx.createRadialGradient(ex, ey, 0, ex, ey, ew * 0.09);
    pupilG.addColorStop(0, "rgba(242,193,78,0.9)");
    pupilG.addColorStop(1, "rgba(212,148,10,0.5)");
    ctx.fillStyle = pupilG;
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.font = `bold ${Math.round(W*0.065)}px 'Courier New', monospace`;
    ctx.textAlign = "center";
    ctx.fillStyle = C.amber;
    ctx.globalAlpha = 0.9;
    ctx.fillText("[ IF ]", W/2, H * 0.18);
    ctx.restore();
    ctx.save();
    ctx.textAlign = "center";
    const titleGrad = ctx.createLinearGradient(0, H*0.55, 0, H*0.72);
    titleGrad.addColorStop(0, "#F5F2EC");
    titleGrad.addColorStop(1, "#C0B89A");
    ctx.fillStyle = titleGrad;
    ctx.font = `900 ${Math.round(W*0.088)}px Georgia, serif`;
    ctx.fillText("STORIES", W/2, H * 0.60);
    ctx.fillText("THAT STAY", W/2, H * 0.695);
    ctx.restore();
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = C.amber;
    ctx.font = `300 ${Math.round(W*0.022)}px 'Courier New', monospace`;
    ctx.globalAlpha = 0.9;
    ctx.fillText("SHORT  FILM  SERIES  ·  MORAL  STORIES  ·  VISUAL  TRUTH", W/2, H * 0.765);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = "rgba(212,148,10,0.35)";
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(W*0.2, H*0.785);
    ctx.lineTo(W*0.8, H*0.785);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(237,232,220,0.5)";
    ctx.font = `400 ${Math.round(W*0.018)}px 'Courier New', monospace`;
    ctx.fillText("IF  MEDIA  DEPARTMENT  ·  2026", W/2, H * 0.82);
    ctx.restore();
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(107,120,136,0.7)";
    ctx.font = `italic ${Math.round(W*0.016)}px Georgia, serif`;
    ctx.fillText('"The most powerful lesson arrives in silence."', W/2, H * 0.875);
    ctx.restore();
  }, []);
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
      <canvas ref={canvasRef} width={680} height={960} style={{
        width: "100%", maxWidth: 480, borderRadius: 8,
        border: `1px solid ${C.border}`,
        boxShadow: `0 0 80px rgba(212,148,10,0.12), 0 0 8px rgba(0,0,0,0.8)`,
      }} />
      <p style={{ color: C.muted, fontSize: 11, letterSpacing: 1, textAlign: "center" }}>
        IF MEDIA · OFFICIAL DEPARTMENT POSTER · 2026
      </p>
    </div>
  );
}

        </div>

      </div>
      {open && (
        <div style={{ padding: "0 18px 18px", borderTop: `1px solid ${C.border}` }}>
          <p style={{ color: C.cream, fontSize: 13, lineHeight: 1.75, margin: "14px 0 12px" }}>{s.synopsis}</p>
          <div style={{ marginBottom: 14 }}>
            <div style={{ color: s.accentColor, fontSize: 10, letterSpacing: 2, marginBottom: 8, fontWeight: 700 }}>EPISODES</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {s.episodes.map((ep, i) => (
                <span key={i} style={{ background: C.panel, border: `1px solid ${C.border}`, color: C.cream, padding: "4px 10px", borderRadius: 20, fontSize: 11 }}>Ep{i+1} · {ep}</span>
              ))}
            </div>
          </div>
          <div style={{ background: s.accentColor + "12", border: `1px solid ${s.accentColor}30`, borderRadius: 8, padding: "10px 14px", marginBottom: 10 }}>
            <span style={{ color: s.accentColor, fontSize: 10, letterSpacing: 2, fontWeight: 700 }}>MORAL LESSON  </span>
            <span style={{ color: C.white, fontSize: 13, fontStyle: "italic" }}>"{s.moral}"</span>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div style={{ background: C.panel, borderRadius: 8, padding: "10px 12px" }}>
              <div style={{ color: C.muted, fontSize: 10, letterSpacing: 1, marginBottom: 4 }}>INSPIRED BY</div>
              <div style={{ color: C.cream, fontSize: 12, lineHeight: 1.6 }}>{s.inspiredBy}</div>
            </div>
            <div style={{ background: C.panel, borderRadius: 8, padding: "10px 12px" }}>
              <div style={{ color: C.muted, fontSize: 10, letterSpacing: 1, marginBottom: 4 }}>PRODUCTION NOTES</div>
              <div style={{ color: C.cream, fontSize: 12, lineHeight: 1.6 }}>{s.productionNotes}</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

                {[["#D4940A","Amber Gold","Primary"],["#F5F2EC","Warm Cream","Type"],["#080A0F","Deep Ink","Background"],["#131720","Panel Dark","Cards"],["#6B7888","Steel Muted","Secondary"]].map(([hex,name,role]) => (
                  <div key={hex} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 8, padding: "12px 14px", minWidth: 110 }}>
                    <div style={{ width: 32, height: 32, borderRadius: 6, background: hex, marginBottom: 8, border: "1px solid rgba(255,255,255,0.1)" }} />
                    <div style={{ color: C.white, fontSize: 12, fontWeight: 700 }}>{name}</div>
                    <div style={{ color: C.muted, fontSize: 10, fontFamily: "monospace" }}>{hex}</div>
                    <div style={{ color: C.dim, fontSize: 10, marginTop: 2 }}>{role}</div>
                  </div>
                ))}
              </div>
            </div>
            <div style={{ marginTop: 32, background: `linear-gradient(135deg, ${C.amber}10, ${C.panel})`, border: `1px solid ${C.amber}30`, borderRadius: 12, padding: 24 }}>
              <div style={{ color: C.amber, fontSize: 10, letterSpacing: 3, marginBottom: 10, fontWeight: 700 }}>BRAND VOICE</div>
              <p style={{ color: C.white, fontSize: 15, lineHeight: 1.85, fontStyle: "italic" }}>
                "We tell stories that don't need a translator. Stories where a grandmother's hands, a child's hesitation, or a stranger's quiet decision carry more meaning than a thousand words. IF Media exists to prove that the most powerful lessons arrive in silence — and that African stories, told honestly, belong to the whole world."
              </p>
            </div>
          </div>
        )}

        {/* SERIES */}
        {tab === "series" && (
          <div>
            <p style={{ color: C.muted, fontSize: 13, marginBottom: 20 }}>7 original series · tap any to expand the full brief.</p>
            {SERIES.map((s,i) => (
              <SeriesCard key={s.id} s={s} open={openSeries === i} onToggle={() => setOpenSeries(openSeries === i ? -1 : i)} />
            ))}
          </div>
        )}

        {/* PILLARS */}
        {tab === "pillars" && (
          <div>
            <h2 style={{ color: C.white, fontSize: 20, fontWeight: 800, marginBottom: 6 }}>Production Pillars</h2>
            <p style={{ color: C.muted, fontSize: 13, marginBottom: 28 }}>Every IF Media piece must honour all six. Non-negotiable.</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 14, marginBottom: 40 }}>
              {PILLARS.map((p,i) => (
                <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "22px 18px" }}>
                  <div style={{ width: 32, height: 32, borderRadius: 8, background: C.amber + "20", border: `1px solid ${C.amber}40`, display: "flex", alignItems: "center", justifyContent: "center", color: C.amber, fontWeight: 900, fontSize: 13, marginBottom: 12 }}>
                    {String(i+1).padStart(2,"0")}
                  </div>
                  <div style={{ color: C.white, fontWeight: 700, fontSize: 15, marginBottom: 6 }}>{p.label}</div>
                  <div style={{ color: C.muted, fontSize: 13, lineHeight: 1.65 }}>{p.detail}</div>
                </div>
              ))}
            </div>
            <h3 style={{ color: C.white, fontSize: 16, fontWeight: 700, marginBottom: 14 }}>Content Format Mix</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {[
                { label: "No-dialogue visual films", pct: 40, color: C.amber },
                { label: "Minimal dialogue narrative", pct: 35, color: C.sky },
                { label: "Observational / documentary style", pct: 15, color: C.moss },
                { label: "Voiceover + image essays", pct: 10, color: C.violet },
              ].map(row => (
                <div key={row.label}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                    <span style={{ color: C.cream, fontSize: 12 }}>{row.label}</span>
                    <span style={{ color: row.color, fontSize: 12, fontWeight: 700 }}>{row.pct}%</span>
                  </div>
                  <div style={{ background: C.panel, borderRadius: 4, height: 6, overflow: "hidden" }}>
                    <div style={{ width: `${row.pct}%`, height: "100%", background: row.color, borderRadius: 4 }} />
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* STRATEGY */}
        {tab === "strategy" && (
          <div>
            <h2 style={{ color: C.white, fontSize: 20, fontWeight: 800, marginBottom: 6 }}>Launch Strategy</h2>
            <p style={{ color: C.muted, fontSize: 13, marginBottom: 28 }}>A phased roadmap from pilot episode to festival circuit.</p>
            <div style={{ marginBottom: 36 }}>
              {PHASES.map((ph,i) => (
                <div key={i} style={{ display: "flex", gap: 16, marginBottom: 14, alignItems: "flex-start" }}>
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flexShrink: 0 }}>
                    <div style={{ width: 36, height: 36, borderRadius: "50%", background: ph.color + "20", border: `2px solid ${ph.color}`, display: "flex", alignItems: "center", justifyContent: "center", color: ph.color, fontWeight: 900, fontSize: 12 }}>{i+1}</div>
                    {i < PHASES.length - 1 && <div style={{ width: 1, height: 30, background: C.border, margin: "4px 0" }} />}
                  </div>
                  <div style={{ flex: 1, background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "14px 16px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8, flexWrap: "wrap", gap: 4 }}>
                      <span style={{ color: C.white, fontWeight: 700, fontSize: 15 }}>{ph.label}</span>
                      <Tag color={ph.color}>{ph.period}</Tag>
                    </div>
                    <ul style={{ paddingLeft: 16, color: C.muted, fontSize: 13, lineHeight: 1.8 }}>
                      {ph.steps.map((s,j) => <li key={j} style={{ color: C.cream }}>{s}</li>)}
                    </ul>
                  </div>
                </div>
              ))}
            </div>
            <h3 style={{ color: C.white, fontSize: 16, fontWeight: 700, marginBottom: 14 }}>Platform Strategy</h3>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 10, marginBottom: 32 }}>
              {[
                { p: "YouTube", use: "Full episode series + playlists", color: C.red },
                { p: "Instagram Reels", use: "60s extracts + BTS + quote cards", color: C.violet },
                { p: "TikTok", use: "45s cuts with on-screen moral text", color: C.sky },
                { p: "WhatsApp", use: "Community premieres + watch parties", color: C.moss },
                { p: "Vimeo", use: "Festival-quality archive + press kit", color: C.amber },
                { p: "Showmax / Netflix Africa", use: "Year 2 anthology pitch", color: C.teal },
              ].map(x => (
                <div key={x.p} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "14px 16px" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: x.color, flexShrink: 0 }} />
                    <span style={{ color: C.white, fontWeight: 700, fontSize: 13 }}>{x.p}</span>
                  </div>
                  <div style={{ color: C.muted, fontSize: 12, lineHeight: 1.6 }}>{x.use}</div>
                </div>
              ))}
            </div>
            <h3 style={{ color: C.white, fontSize: 16, fontWeight: 700, marginBottom: 14 }}>Weekly Drop Schedule</h3>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6 }}>
              {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((day,i) => (
                <div key={day} style={{
                  background: [1,4].includes(i) ? C.amber + "18" : C.panel,
                  border: `1px solid ${[1,4].includes(i) ? C.amber + "40" : C.border}`,
                  borderRadius: 8, padding: "10px 6px", textAlign: "center",
                }}>
                  <div style={{ color: [1,4].includes(i) ? C.amber : C.muted, fontSize: 11, fontWeight: 700 }}>{day}</div>
                  <div style={{ color: C.muted, fontSize: 9, marginTop: 4 }}>
                    {i === 1 ? "Full drop" : i === 4 ? "Reel + quote" : "—"}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* REFERENCES */}
        {tab === "refs" && (
          <div>
            <h2 style={{ color: C.white, fontSize: 20, fontWeight: 800, marginBottom: 6 }}>Research & Reference</h2>
            <p style={{ color: C.muted, fontSize: 13, marginBottom: 28 }}>Real films and platforms that validate the IF Media vision — and set the quality bar.</p>
            {REFS.map((r,i) => (
              <div key={i} style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, padding: "16px 18px", marginBottom: 10, display: "flex", gap: 14, alignItems: "flex-start" }}>
                <div style={{ width: 32, height: 32, borderRadius: 8, background: C.amber + "18", border: `1px solid ${C.amber}30`, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", color: C.amber, fontWeight: 900, fontSize: 13 }}>{i+1}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 4 }}>
                    <span style={{ color: C.white, fontWeight: 700, fontSize: 14 }}>{r.title}</span>
                    <Tag>{r.tag}</Tag>
                  </div>
                  <div style={{ color: C.amber, fontSize: 11, marginBottom: 5 }}>{r.origin}</div>
                  <div style={{ color: C.muted, fontSize: 13, lineHeight: 1.65 }}>{r.note}</div>
                </div>
              </div>
            ))}
            <div style={{ marginTop: 28, background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: "16px 18px" }}>
              <div style={{ color: C.muted, fontSize: 10, letterSpacing: 2, marginBottom: 8 }}>RESEARCH SOURCES</div>
              <div style={{ color: C.muted, fontSize: 12, lineHeight: 1.8 }}>
                UK Film Review Best 2025 · Short of the Week Best 2024 · Talking Shorts Top 3 (2024 & 2025) · Film Shortage Top 10 2025 · Afrocritik 20 Remarkable African Short Films 2025 · Script Magazine MUTE Series Interview · Pulse Africa Storytelling Techniques · Africa Magic AMVCA Short Film Category · Medium — Humanizing Africa in Film (2025)
              </div>
            </div>
          </div>
        )}
      </div>

      {/* FOOTER */}
      <div style={{ borderTop: `1px solid ${C.border}`, padding: "20px 24px", textAlign: "center", color: C.dim, fontSize: 11, letterSpacing: 2 }}>
        IF MEDIA DEPARTMENT · SHORT FILM DIVISION · CONTENT BRIEF 2026
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
